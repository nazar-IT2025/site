<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <style>
        body{
            background-image: url("https://images.hitpaw.com/topics/gif-tips/duck-transparent-gif.gif");
            background-size: 200px;
            background-repeat: no-repeat;
            background-position: 100% 100%;
            background-attachment: fixed;
        }
        p{
            font-size: 1in;
            color: white;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfaLsKD7k_I3f68uxiCkD5uzEBmXroiXr67NHJuiySwA&s=10);
            background-size: cover;
            margin: 0;
        }
        div{
            width: 500px;
            height: 500px;
            margin-bottom: 10px;
        }
        #d1{
            background-image: url("https://cdn.pixabay.com/photo/2023/12/30/11/22/monstera-8477880_1280.jpg");
            background-size: cover;
            border: 30px darkmagenta groove;
        }
        #d2{
            background: linear-gradient(rgba(255,255,0,0.5), rgba(0,0,255,0.5)),url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGgJtYeY7wIKPDfQ0WCOkFP284qiip5dTVW8KLCkYN-Q&s=10");
            background-repeat: no-repeat;
            background-size: cover;
            border-width: 30px;
            border-style: solid;
            border-image: linear-gradient(#f6b73c, #4d9f0c) 30;
        }
        img{
            margin: auto;
            display: flex;
            margin-bottom: 40px;
        }
        #img1{
            width: 20%;
            border-radius: 10%;
            box-shadow: 20px 20px 60px black;
        }
        #img2{
            width: 20%;
            border-radius: 10%;
            box-shadow: 20px 20px 60px black;
        }
    </style>
</head>
<body>
    <p>Ми вивчаємо роботу з зображеннями</p>
    <div id="d1"></div>
    <div id="d2"></div>
    <img id="img1" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSq-Qr_tzqcmiG5dlCleVdoPj_d76OWn1etTfxB_qqXoA&s=10" alt="Пейзаж" title="Пейзаж">
    <img id="img2" src="images/Background_Vector_Art.jpg" alt="background" title="background">

    
</body>
</html>
