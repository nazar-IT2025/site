<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анімація</title>
    <link rel="stylesheet" href="styles/animation.css">
</head>
<body>
    <marquee behavior="" direction="" style="background-color: blue; color: yellow; font-size: 50px;">Слава Україні</marquee>
    <marquee behavior="" direction="" style="background-color: yellow; color: blue; font-size: 50px; width: 50%;">Слава Україні</marquee><marquee behavior="" direction="right" style="background-color: blue; color: yellow; font-size: 50px; width: 50%;">Слава Україні</marquee>
    <marquee behavior="alternate" direction="up" style="background-color: blue; color: yellow; font-size: 50px; height: 100px; width: 40%; text-align: center;">Слава Україні</marquee>
    <marquee behavior="slide" loop="3" direction="down" style="background-color: blue; color: yellow; font-size: 50px; height: 100px; width: 40%; text-align: center;">Слава Україні</marquee>

    <marquee behavior="alternate" direction="down" style="background-color: yellow; color: blue; font-size: 50px; width: 50%; height: 300px;"><marquee behavior="alternate">Слава Україні</marquee></marquee>
    <marquee behavior="" direction="right" scrollamount="30"><img src="https://mir-s3-cdn-cf.behance.net/project_modules/hd/5eeea355389655.59822ff824b72.gif" alt="" width="300px"></marquee>
</body>
</html>
